<style>
/* Layout: sticky search bar, summary strip, day chips, note cards grouped by delivery note */
:root{--bg:#f3f6f8;--card:#ffffff;--fg:#14212b;--muted:#5b6b77;--line:#d8e0e6;--accent:#0b5f8a;--accent-soft:#e1eef6;--ok:#1d7a46;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--card:#16222b;--fg:#e6eef3;--muted:#93a6b3;--line:#273741;--accent:#5bb4e3;--accent-soft:#16324a;--ok:#5fcf8f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161c;--card:#16222b;--fg:#e6eef3;--muted:#93a6b3;--line:#273741;--accent:#5bb4e3;--accent-soft:#16324a;--ok:#5fcf8f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
header h1{font-size:1.35rem;margin:0;font-weight:700;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px}
#q{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
.filters{display:flex;gap:8px}
.filters select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.daysel{width:100%;font:inherit;font-size:15px;font-weight:600;padding:10px;border:1.5px solid var(--accent);border-radius:8px;background:var(--card);color:var(--fg);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;font-variant-numeric:tabular-nums}
.tab small{font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.85}
.atolls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.atolls .tab{min-width:0;border-radius:10px;padding:6px 4px;font-size:14px;text-align:center}
.atolls .tab b{font-weight:600;white-space:nowrap}
.atolls .tab small{font-size:11px}
.atolls .sn{display:none}
@media (max-width:330px){.atolls .fn{display:none}.atolls .sn{display:inline}}
.atolls .tab[data-empty="1"]{opacity:.5}
.code{font-family:var(--mono);font-size:.75rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .n{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nh{padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border-bottom:1px solid var(--line)}
.isl{font-weight:700;font-size:1.2rem;color:var(--accent);letter-spacing:.01em}
.nh{border-left:5px solid var(--accent)}
.ref{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.date{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;background:var(--accent-soft)}
.meta span{color:var(--muted)}
.meta strong{color:var(--fg);font-weight:600}
.tel{font-family:var(--mono);color:var(--accent);font-weight:500;text-decoration:none}
ul.items{list-style:none;margin:0;padding:4px 12px 8px}
ul.items li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
ul.items li:last-child{border-bottom:0}
ul.items .t{flex:1;min-width:0}
ul.items .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
mark{background:#ffe27a;color:#14212b;border-radius:2px}
.count{font-size:.85rem;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
h2{font-size:1rem;margin:8px 0 0}
.boats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.boat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.boat .bn{font-weight:600}
.boat .bs{font-size:.8rem;color:var(--muted)}
#more{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.ph img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
.photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.photo label{font-weight:600;font-size:.92rem;width:100%}
.photo input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.photo small{width:100%;color:var(--muted);font-size:.75rem}
.pbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--card);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:8px;font-size:.92rem;white-space:nowrap}
.plinks{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 10px}
.plink{font-size:.8rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:4px 11px;text-decoration:none;font-weight:500}
.pbtn:focus-visible,.plink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
footer{font-size:.78rem;color:var(--muted)}
</style>

function match(n){
 if(state.day&&n.date!==state.day)return null;
 if(state.atoll&&atollOf(n.island)!==state.atoll)return null;
 if(state.isl&&n.island!==state.isl)return null;
 if(state.boat&&n.boat!==state.boat)return null;
 if(!state.q)return n.items;
 const terms=state.q.toLowerCase().split(/\s+/);
 const head=[n.island,n.ref,n.boat,n.staff,n.date,CONTACTS[n.boat]||''].join(' ').toLowerCase();
 const its=n.items.filter(it=>terms.every(t=>(head+' '+it.item).toLowerCase().includes(t)));
 return its.length?its:null;
}

 <ul class="items">${n.shown.map(i=>`<li><span class="t">${hl(i.item,q)}</span><span class="q">× ${i.qty}</span></li>`).join('')}</ul>${(p=>p?`<button class="ph" data-src="${p[0]}" aria-label="Open photo"><img src="${p[0]}" alt="${esc(p[1])}" loading="lazy"><span>📷 Photo · ${esc(p[1])}</span></button>`:'')((PHOTOS[n.date+'|'+n.island+'|'+n.ref]||PHOTOS[n.date+'|'+n.ref]))}</article>`}).join(''):`<div class="empty">Nothing found. Try another word, like an island name, boat or LPO number.</div>`;
